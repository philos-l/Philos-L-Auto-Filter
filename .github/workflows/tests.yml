name: Tests

on:
  push:
    paths-ignore:
      - 'state/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run tests
        run: python -m unittest -v
