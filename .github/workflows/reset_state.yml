name: Reset State

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Nome profilo da azzerare (lascia vuoto per tutti)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Reset state
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        # Lo stato viene azzerato, non cancellato: un profilo senza stato
        # sarebbe trattato come nuovo e ripartirebbe dalle mail future
        run: |
          if [ -z "$PROFILE" ]; then
            python3 mail_monitor_multi.py --reset
          else
            python3 mail_monitor_multi.py --reset --profile "$PROFILE"
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "chore: reset profile state"
          git push

      - name: Notify users
        env:
          PROFILE: ${{ github.event.inputs.profile }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$PROFILE" ]; then
            python3 mail_monitor_multi.py --notify reset
          else
            python3 mail_monitor_multi.py --notify reset --profile "$PROFILE"
          fi
