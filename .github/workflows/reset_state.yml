name: Reset State

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Nome del profilo da azzerare (es. mario). Per azzerarli tutti scrivi: everyone'
        required: true
      confirm:
        description: 'Confermo: gli utenti azzerati riceveranno di nuovo le notifiche di tutte le vecchie mail'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        if: ${{ !inputs.confirm }}
        run: |
          echo "::error::Reset non confermato: spunta la casella di conferma e rilancia il workflow."
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Reset state
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        # Lo stato viene azzerato, non cancellato: un profilo senza stato
        # sarebbe trattato come nuovo e ripartirebbe dalle mail future
        run: |
          if [ "$PROFILE" = "everyone" ]; then
            python3 mail_monitor_multi.py --reset
          else
            python3 mail_monitor_multi.py --reset --profile "$PROFILE"
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "chore: reset profile state"
          git push

      - name: Notify users
        env:
          PROFILE: ${{ github.event.inputs.profile }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "$PROFILE" = "everyone" ]; then
            python3 mail_monitor_multi.py --notify reset
          else
            python3 mail_monitor_multi.py --notify reset --profile "$PROFILE"
          fi
